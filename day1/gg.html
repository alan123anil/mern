<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EDUNET</title>
    <style>
        /* General Styles */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        /* Header Styles */
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 20px;
            background-color: #007BFF;
            color: white;
        }

        header img {
            height: 50px;
            width: 50px;
            border-radius: 50%;
        }

        header h1 {
            flex-grow: 1;
            margin-left: 20px;
        }

        header button, header input[type="text"] {
            margin-left: 10px;
            padding: 5px 10px;
            font-size: 14px;
            border: none;
            border-radius: 5px;
        }

        header button {
            background-color: white;
            color: #007BFF;
            cursor: pointer;
        }

        header button:hover {
            background-color: #0056b3;
            color: white;
        }

        header input[type="text"] {
            max-width: 200px;
        }

        /* Navigation Bar Styles */
        nav {
            background-color: #0056b3;
        }

        nav ul {
            list-style: none;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
        }

        nav ul li {
            margin: 0 15px;
        }

        nav ul li a {
            text-decoration: none;
            color: white;
            font-size: 16px;
            padding: 10px 15px;
            display: inline-block;
        }

        nav ul li a:hover {
            background-color: #007BFF;
            border-radius: 5px;
        }

        /* Main Content Styles */
        main {
            padding: 20px;
        }

        main section {
            background-color: #f4f4f4;
            padding: 20px;
            border-radius: 5px;
        }

        /* Footer Styles */
        footer {
            text-align: center;
            background-color: #007BFF;
            color: white;
            padding: 10px 0;
        }
    </style>
</head>
<body>
    <header>
        <img src="download.jpg" alt="Edunet Logo">
        <h1><b>EDUNET</b></h1>
        <div>
            <button>Login</button>
            <button>Sign Up</button>
            <input type="text" placeholder="Search">
            <button type="submit">Search</button>
        </div>
    </header>

    <nav>
        <ul>
            <li><a href="#home">Home</a></li>
            <li><a href="#product">Product</a></li>
            <li><a href="#shopping">Shopping</a></li>
            <li><a href="#product-cat">Product Categories</a></li>
            <li><a href="#payment">Payment</a></li>
        </ul>
    </nav>

    <main>
        <section>
            <h2>Main Content</h2>
            <p>This is where the main content goes.</p>
        </section>
    </main>

    <footer>
        <p>&copy; 2025 Your Name. All rights reserved.</p>
    </footer>
</body>
</html>
