<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Examples</title>
  
  <!-- Link to External CSS -->
  <link rel="stylesheet" href="one two.css">
  
  <!-- Internal CSS -->
  <style>
    .internal-style {
      color: blue;
      font-size: 18px;
      text-align: center;
    }
  </style>
</head>
<body>
  <h1 style="color: red; text-decoration: underline;">This is Inline CSS</h1> <!-- Inline CSS -->

  <p class="internal-style">This is styled using Internal CSS.</p>

  <p class="external-style">This is styled using External CSS.</p>
</body>
</html>
