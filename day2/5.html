<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Grid</title>
  <link rel="stylesheet" href="five.css">
</head>
<body>
  <div class="filter-bar">
    <button>Filter by Price</button>
    <button>Filter by Rating</button>
  </div>
  
  <div class="product-grid">
    <div class="product-card">
      <img src="download (2).jpg" alt="Product 1" class="product-image">
      <div class="product-details">
        <h3 class="product-title">Product 1</h3>
        <p class="product-price">$20.00</p>
        <p class="product-rating">★★★★☆</p>
        <button class="add-to-cart">Add to Cart</button>
      </div>
    </div>
    <div class="product-card">
      <img src="images.jpg" alt="Product 2" class="product-image">
      <div class="product-details">
        <h3 class="product-title">Product 2</h3>
        <p class="product-price">$35.00</p>
        <p class="product-rating">★★★☆☆</p>
        <button class="add-to-cart">Add to Cart</button>
      </div>
    </div>
    <!-- Add more product cards here -->
  </div>
</body>
</html>
