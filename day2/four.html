<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Listing</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="s.css">
</head>
<body>
  <!-- Header Section -->
  <header>
    <div class="logo">My E-Commerce</div>
    <nav class="nav-menu">
      <ul>
        <li><a href="#">Home</a></li>
        <li><a href="#">Shop</a></li>
        <li><a href="#">About</a></li>
        <li><a href="#">Contact</a></li>
      </ul>
    </nav>
    <div class="search-cart">
      <input type="text" placeholder="Search...">
      <div class="cart-icon">🛒</div>
    </div>
  </header>

  <!-- Main Content Section -->
  <main>
    <!-- Sidebar Filters (Collapsable on Mobile) -->
    <div class="sidebar" id="sidebar">
      <button class="filter-toggle" onclick="toggleSidebar()">☰ Filters</button>
      <div class="sidebar-content">
        <h3>Filters</h3>
        <form>
          <label>Category</label>
          <select>
            <option>Electronics</option>
            <option>Fashion</option>
            <option>Home & Kitchen</option>
          </select>
          <label>Price Range</label>
          <input type="range" min="0" max="500" step="10">
          <label>Brand</label>
          <select>
            <option>Brand A</option>
            <option>Brand B</option>
            <option>Brand C</option>
          </select>
        </form>
      </div>
    </div>

    <!-- Product Grid (More Products) -->
    <div class="product-grid">
      <div class="product">
        <img src="download (1).jpg" alt="Product 1">
        <h4>Product 1</h4>
        <p>$50.00</p>
        <button class="add-to-cart">Add to Cart</button>
      </div>
      <div class="product">
        <img src="download (2).jpg" alt="Product 2">
        <h4>Product 2</h4>
        <p>$60.00</p>
        <button class="add-to-cart">Add to Cart</button>
      </div>
      <div class="product">
        <img src="images (5).jpg" alt="Product 3">
        <h4>Product 3</h4>
        <p>$40.00</p>
        <button class="add-to-cart">Add to Cart</button>
      </div>
      <div class="product">
        <img src="images (1).jpg" alt="Product 4">
        <h4>Product 4</h4>
        <p>$75.00</p>
        <button class="add-to-cart">Add to Cart</button>
      </div>
      <div class="product">
        <img src="download (4).jpg" alt="Product 5">
        <h4>Product 5</h4>
        <p>$100.00</p>
        <button class="add-to-cart">Add to Cart</button>
      </div>
      <div class="product">
        <img src="images (3).jpg" alt="Product 6">
        <h4>Product 6</h4>
        <p>$55.00</p>
        <button class="add-to-cart">Add to Cart</button>
      </div>
      <div class="product">
        <img src="product7.jpg" alt="Product 7">
        <h4>Product 7</h4>
        <p>$80.00</p>
        <button class="add-to-cart">Add to Cart</button>
      </div>
      <div class="product">
        <img src="product8.jpg" alt="Product 8">
        <h4>Product 8</h4>
        <p>$60.00</p>
        <button class="add-to-cart">Add to Cart</button>
      </div>
      <div class="product">
        <img src="product9.jpg" alt="Product 9">
        <h4>Product 9</h4>
        <p>$120.00</p>
        <button class="add-to-cart">Add to Cart</button>
      </div>
    </div>

    <!-- Pagination -->
    <div class="pagination">
      <button class="page-btn">First</button>
      <button class="page-btn">Previous</button>
      <button class="page-btn">Next</button>
      <button class="page-btn">Last</button>
    </div>
  </main>

  <!-- Footer Section -->
  <footer>
    <ul>
      <li><a href="#">Contact Us</a></li>
      <li><a href="#">Privacy Policy</a></li>
      <li><a href="#">Terms of Service</a></li>
    </ul>
  </footer>

  <!-- JavaScript for Sidebar Toggle -->
  <script>
    function toggleSidebar() {
      const sidebar = document.getElementById('sidebar');
      sidebar.classList.toggle('collapsed');
    }
  </script>
</body>
</html>
