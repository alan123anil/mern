<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Manager</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .completed {
      text-decoration: line-through;
      color: gray;
    }
  </style>
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">Task Manager</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav">
          <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="#">Tasks</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container mt-4">
    <div class="row">
      <div class="col-12 col-md-6 offset-md-3">
        <h3 class="text-center mb-4">Task Manager</h3>

        <form id="taskForm" class="mb-4">
          <div class="input-group">
            <input type="text" id="taskInput" class="form-control" placeholder="Enter a task" required>
            <button class="btn btn-primary" type="submit">Add Task</button>
          </div>
          <div class="form-text text-danger d-none" id="validationMessage">Task cannot be empty.</div>
        </form>

        <ul id="taskList" class="list-group"></ul>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const taskForm = document.getElementById('taskForm');
    const taskInput = document.getElementById('taskInput');
    const taskList = document.getElementById('taskList');
    const validationMessage = document.getElementById('validationMessage');

    taskForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const taskName = taskInput.value.trim();
      if (taskName === '') {
        validationMessage.classList.remove('d-none');
        return;
      }
      validationMessage.classList.add('d-none');
      const taskItem = document.createElement('li');
      taskItem.className = 'list-group-item d-flex justify-content-between align-items-center';
      taskItem.innerHTML = `
        <div>
          <input type="checkbox" class="form-check-input me-2 task-checkbox">
          <span class="task-name">${taskName}</span>
        </div>
        <button class="btn btn-sm btn-danger delete-btn">Delete</button>
      `;
      taskList.appendChild(taskItem);
      taskInput.value = '';
    });

    taskList.addEventListener('click', (e) => {
      const target = e.target;
      if (target.classList.contains('delete-btn')) {
        target.closest('li').remove();
      }
      if (target.classList.contains('task-checkbox')) {
        const taskName = target.nextElementSibling;
        taskName.classList.toggle('completed');
      }
    });
  </script>
</body>
</html>
